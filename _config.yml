#-------------------------------------------------------------------------------
# Site Settings
#-------------------------------------------------------------------------------

title: Insecure Sites List
tagline: "C'mon, upgrade to HTTPS!!"
description: >- # Short description for SEO metadata
  A curated archive and directory of legacy, plaintext HTTP websites, 
  IP webcams, and unencrypted hobbyist streams.

# The production URL of your site
url: "https://isl.pages.dev" # Or "https://leoc755.github.io" if you prefer

# The base URL after the domain. 
# For isl.pages.dev, leave it as ""
# For GitHub Pages project repositories (e.g., /insecure-sites-list), uncomment below:
# baseurl: "/insecure-sites-list"

#-------------------------------------------------------------------------------
# Author Settings
#-------------------------------------------------------------------------------

author:
  name: leoc755
  twitter: ""       # Add your handle if you want it linked in the footer
  github: leoc755

#-------------------------------------------------------------------------------
# Theme Customization
#-------------------------------------------------------------------------------

theme: jekyll-theme-chirpy

# Permit Google/Bing to index your list
robots: index

# Language and timezone configuration
lang: en
timezone: UTC

# Build settings
permalink: /posts/:title/
paginate: 10

#-------------------------------------------------------------------------------
# Chirpy Specific Features (Toggle as needed)
#-------------------------------------------------------------------------------

# Avatar image for the sidebar
avatar: 'https://github.com/leoc755.png' # Automatically pulls your GitHub profile pic

# Social links in the sidebar/footer
social:
  links:
    - https://github.com/leoc755

# Sidebar panel layout configuration
theme_mode: dark # Options: light, dark. Forces dark mode by default if you want that hacker vibe!

# Disable things you might not need for a simple list project
comments:
  active: false # Disables Disqus/Utterances comments
